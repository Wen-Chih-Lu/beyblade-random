<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>戰鬥陀螺 X 抽籤器</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-gold: #f59e0b;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: var(--accent-color);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    p.subtitle {
      color: #94a3b8;
      margin-bottom: 2rem;
      text-align: center;
    }

    /* 陀螺卡片展示區 */
    .combo-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      max-width: 900px;
      width: 100%;
      margin-bottom: 2rem;
    }

    .part-card {
      position: relative;
      background: var(--card-bg);
      border: 2px solid #334155;
      border-radius: 12px;
      width: 260px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      transition: all 0.4s ease;
    }

    .part-card.rolling {
      border-color: var(--accent-color);
      transform: translateY(-3px);
    }

    /* === T0 特效樣式 === */
    .part-card.t0-effect {
      border-color: #fbbf24 !important;
      animation: t0Glow 1.5s infinite alternate ease-in-out, t0Pop 0.4s ease-out;
    }

    @keyframes t0Glow {
      0% {
        box-shadow: 0 0 15px rgba(251, 191, 36, 0.4), inset 0 0 10px rgba(251, 191, 36, 0.2);
      }
      100% {
        box-shadow: 0 0 30px rgba(251, 191, 36, 0.9), inset 0 0 20px rgba(251, 191, 36, 0.4);
      }
    }

    @keyframes t0Pop {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* T0 標籤 */
    .t0-badge {
      display: none;
      position: absolute;
      top: -12px;
      right: -12px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      font-size: 0.8rem;
      font-weight: 900;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.5);
      border: 2px solid #fff;
      animation: badgeBounce 0.5s ease-out;
    }

    .part-card.t0-effect .t0-badge {
      display: block;
    }

    @keyframes badgeBounce {
      0% { transform: scale(0); }
      80% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .part-tag {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-bottom: 1rem;
      background: rgba(245, 158, 11, 0.1);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
    }

    .img-box {
      width: 160px;
      height: 160px;
      background-color: #0f172a;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 1rem;
      border: 1px solid #334155;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .part-name {
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      min-height: 2.8em;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    /* 單項抽籤按鈕 */
    .btn-part-draw {
      background: #0284c7;
      color: white;
      font-size: 0.95rem;
      font-weight: bold;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-part-draw:hover {
      background: #0369a1;
    }

    /* 底部全抽取按鈕區域 */
    .action-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .btn-all-draw {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      font-size: 1.25rem;
      font-weight: bold;
      padding: 0.9rem 2.8rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 14px 0 rgba(245, 158, 11, 0.39);
      transition: all 0.2s ease;
    }

    .btn-all-draw:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px 0 rgba(245, 158, 11, 0.55);
    }

    button:disabled {
      background: #64748b !important;
      cursor: not-allowed !important;
      transform: none !important;
      box-shadow: none !important;
    }

    .result-summary {
      font-size: 1.2rem;
      color: var(--accent-gold);
      font-weight: bold;
      min-height: 1.5em;
      text-align: center;
    }
  </style>
</head>

        { name: "RA 軸", img: "images/Bit/RA.jpeg" },
        { name: "S 軸", img: "images/Bit/S.jpeg" },
        { name: "T 軸", img: "images/Bit/T.jpeg" },
        { name: "TK 軸", img: "images/Bit/TK.jpeg" },
        { name: "TP 軸", img: "images/Bit/TP.jpeg" },
        { name: "TR 軸", img: "images/Bit/TR.jpeg" },
        { name: "U 軸", img: "images/Bit/U.jpeg" },
        { name: "UF 軸", img: "images/Bit/UF.jpeg" },
        { name: "UN 軸", img: "images/Bit/UN.jpeg" },
        { name: "R 軸", img: "images/Bit/R.jpeg" },
        { name: "V 軸", img: "images/Bit/V.jpeg" },
        { name: "W 軸", img: "images/Bit/W.jpeg" },
        { name: "WB 軸", img: "images/Bit/WB.jpeg" },
        { name: "WW 軸", img: "images/Bit/WW.jpeg" },
        { name: "Y 軸", img: "images/Bit/Y.jpeg" },
        { name: "Z 軸", img: "images/Bit/Z.jpeg" }
      ]
    };

    // 紀錄目前的組合選擇
    const currentCombination = {
      blade: null,
      ratchet: null,
      bit: null
    };

    // 狀態追蹤
    const isDrawing = { blade: false, ratchet: false, bit: false };

    function getRandomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    // 獨立抽取單一零件
    function drawSingle(partType) {
      if (isDrawing[partType]) return;

      isDrawing[partType] = true;
      setButtonsState(partType, true);

      const card = document.getElementById(`${partType}-card`);
      card.classList.remove('t0-effect'); // 抽取前移除 T0 特效
      card.classList.add('rolling');

      let counter = 0;
      const maxRolls = 15;
      const intervalSpeed = 70;

      const timer = setInterval(() => {
        const tempItem = getRandomItem(partsData[partType]);
        updateDisplay(partType, tempItem);
        counter++;

        if (counter >= maxRolls) {
          clearInterval(timer);
          const finalItem = getRandomItem(partsData[partType]);
          updateDisplay(partType, finalItem);
          currentCombination[partType] = finalItem.name;

          card.classList.remove('rolling');

          // 若抽到 T0 零件，觸發發光特效！
          if (finalItem.isT0) {
            card.classList.add('t0-effect');
          }

          isDrawing[partType] = false;
          setButtonsState(partType, false);

          checkFullComboSummary();
        }
      }, intervalSpeed);
    }

    // 一鍵全套抽取
    function drawAll() {
      drawSingle('blade');
      drawSingle('ratchet');
      drawSingle('bit');
    }

    function updateDisplay(partType, item) {
      document.getElementById(`${partType}-name`).innerText = item.name;
      const imgElem = document.getElementById(`${partType}-img`);
      
      imgElem.src = item.img;
      imgElem.onerror = function() {
        this.src = `https://via.placeholder.com/160?text=${encodeURIComponent(item.name)}`;
      };
    }

    function setButtonsState(partType, disabled) {
      document.getElementById(`${partType}-btn`).disabled = disabled;
      // 若任一正在抽取，全抽按鈕禁用
      const anyDrawing = Object.values(isDrawing).some(state => state === true);
      document.getElementById('all-btn').disabled = anyDrawing;
    }

    // 檢查並顯示完整組合文字
    function checkFullComboSummary() {
      const { blade, ratchet, bit } = currentCombination;
      if (blade && ratchet && bit) {
        document.getElementById('result-text').innerText = 
          `目前組合：${blade} ${ratchet} ${bit}`;
      }
    }
  </script>
</body>
</html>
